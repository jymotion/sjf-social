name: Refresh short links

# The redirect pages are generated by build.py in the sanjoseforce repo, which
# normally expects this checkout as a sibling directory. That is not true in a
# cloud session or on a fresh machine, so this repo regenerates itself: it clones
# the site source and points build.py here with SJF_SHORT_DIR.
#
# Needs no secrets. sanjoseforce is public, and the default token can commit here.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-short-links
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the site source
        run: git clone --depth 1 https://github.com/jymotion/sanjoseforce.git "$RUNNER_TEMP/src"

      - name: Regenerate the redirect pages
        env:
          SJF_SHORT_DIR: ${{ github.workspace }}
        run: python3 "$RUNNER_TEMP/src/build.py"

      - name: Commit anything new
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "short links already up to date"
            exit 0
          fi
          git status --short
          git add -A
          git commit -m "Refresh short links from sanjoseforce"
          git push
